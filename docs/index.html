<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PL 2026-27 Predictor</title>
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --title-color: #f0c419;
    --top4-color: #3fb950;
    --relegation-color: #f85149;
    --accent: #58a6ff;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 40px 20px;
  }
  .container { max-width: 900px; margin: 0 auto; }
  h1 {
    font-size: 28px;
    margin-bottom: 4px;
  }
  .subtitle {
    color: var(--text-dim);
    font-size: 14px;
    margin-bottom: 32px;
  }
  .meta {
    display: flex;
    gap: 24px;
    margin-bottom: 24px;
    font-size: 13px;
    color: var(--text-dim);
  }
  .meta span strong { color: var(--text); }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    font-size: 14px;
  }
  th {
    text-align: left;
    padding: 12px 16px;
    background: #1c2128;
    color: var(--text-dim);
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 1px solid var(--border);
  }
  td {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #1c2128; }
  .pos { color: var(--text-dim); width: 30px; }
  .team { font-weight: 600; }
  .pct-bar {
    display: inline-block;
    height: 6px;
    border-radius: 3px;
    vertical-align: middle;
    margin-left: 8px;
  }
  .title-pct { color: var(--title-color); font-weight: 600; }
  .top4-pct { color: var(--top4-color); }
  .releg-pct { color: var(--relegation-color); }
  .zone-champions td:first-child { border-left: 3px solid var(--title-color); }
  .zone-top4 td:first-child { border-left: 3px solid var(--top4-color); }
  .zone-relegation td:first-child { border-left: 3px solid var(--relegation-color); }
  .legend {
    display: flex;
    gap: 20px;
    margin-top: 16px;
    font-size: 12px;
    color: var(--text-dim);
  }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .footer {
    margin-top: 32px;
    font-size: 12px;
    color: var(--text-dim);
    text-align: center;
  }
  .loading, .error {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
  }
</style>
</head>
<body>
<div class="container">
  <h1>⚽ Premier League 2026-27 Predictor</h1>
  <p class="subtitle">10,000-trial Monte Carlo simulation, powered by Elo ratings + a Poisson goals model, retrained weekly</p>

  <div id="content">
    <div class="loading">Loading predictions...</div>
  </div>

  <div class="footer" id="footer"></div>
</div>

<script>
async function loadPredictions() {
  try {
    const response = await fetch('predictions.json?t=' + Date.now()); // cache-bust
    if (!response.ok) throw new Error('Could not load predictions.json');
    const data = await response.json();
    render(data);
  } catch (err) {
    document.getElementById('content').innerHTML =
      `<div class="error">Couldn't load predictions right now.<br><small>${err.message}</small></div>`;
  }
}

function zoneClass(index) {
  if (index === 0) return 'zone-champions';
  if (index < 4) return 'zone-top4';
  if (index >= 17) return 'zone-relegation';
  return '';
}

function render(data) {
  const standings = data.standings.slice().sort((a, b) => b.avg_points - a.avg_points);

  const rows = standings.map((team, i) => `
    <tr class="${zoneClass(i)}">
      <td class="pos">${i + 1}</td>
      <td class="team">${team.team}</td>
      <td>${team.avg_points.toFixed(1)}</td>
      <td class="title-pct">${team.title_pct > 0 ? team.title_pct.toFixed(1) + '%' : '—'}</td>
      <td class="top4-pct">${team.top4_pct.toFixed(1)}%</td>
      <td class="releg-pct">${team.relegation_pct.toFixed(1)}%</td>
    </tr>
  `).join('');

  document.getElementById('content').innerHTML = `
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Team</th>
          <th>Avg Pts</th>
          <th>Title</th>
          <th>Top 4</th>
          <th>Relegation</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="legend">
      <span><span class="dot" style="background: var(--title-color)"></span> Title zone</span>
      <span><span class="dot" style="background: var(--top4-color)"></span> Champions League</span>
      <span><span class="dot" style="background: var(--relegation-color)"></span> Relegation zone</span>
    </div>
  `;

  const updated = new Date(data.last_updated);
  document.getElementById('footer').innerHTML =
    `Based on ${data.n_trials.toLocaleString()} simulated seasons · Last updated ${updated.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })} at ${updated.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })} UTC`;
}

loadPredictions();
</script>
</body>
</html>
